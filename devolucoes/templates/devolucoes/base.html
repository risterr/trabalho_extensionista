<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Controle de Devoluções - RRister Imports</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f3f5;
            margin: 0;
            color: #333;
        }
        header {
            background-color: #1f3864;
            color: white;
            padding: 15px 20px;
        }
        header h1 { margin: 0; font-size: 20px; }
        nav { background-color: #2f5597; padding: 10px 20px; }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-size: 14px;
        }
        nav a:hover { text-decoration: underline; }
        .conteudo {
            max-width: 900px;
            margin: 20px auto;
            background-color: white;
            padding: 20px;
            border: 1px solid #ddd;
        }
        h2 { color: #1f3864; font-size: 18px; margin-top: 0; }
        label { display: block; margin-top: 12px; font-size: 14px; font-weight: bold; }
        .campo {
            width: 100%;
            padding: 7px;
            border: 1px solid #bbb;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }
        .botao {
            background-color: #2f5597;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 14px;
            margin-top: 18px;
            cursor: pointer;
        }
        .botao-excluir {
            background-color: #c00000;
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 12px;
            cursor: pointer;
        }
        .botao-excluir:hover { background-color: #900000; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
        th { background-color: #1f3864; color: white; padding: 8px; text-align: left; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        tr:nth-child(even) td { background-color: #fafafa; }
        .caixas { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        .caixa {
            flex: 1;
            min-width: 150px;
            border: 1px solid #ddd;
            padding: 14px;
            background-color: #f8f9fb;
        }
        .caixa .numero { font-size: 26px; font-weight: bold; color: #1f3864; }
        .caixa .texto { font-size: 12px; color: #666; }
        .barra { background-color: #e5e5e5; height: 18px; margin-top: 4px; }
        .barra div { background-color: #2f5597; height: 18px; }
        footer { text-align: center; font-size: 11px; color: #888; padding: 15px; }
        .usuario {
            background-color: #17294f;
            color: #cdd7ea;
            padding: 6px 20px;
            font-size: 12px;
            text-align: right;
        }
        .usuario a { color: #cdd7ea; margin-left: 12px; }
    </style>
</head>
<body>
    <div class="usuario">
        Funcionario: <strong>{{ request.session.funcionario_nome }}</strong>
        <a href="{% url 'sair' %}">Trocar funcionário</a>
    </div>
    <header>
        <h1>Sistema de Controle de Devolução de Mercadorias</h1>
    </header>
    <nav>
        <a href="/">Registrar devolução</a>
        <a href="/lista/">Devoluções registradas</a>
        <a href="/dashboard/">Dashboard</a>
    </nav>
    <div class="conteudo">
        {% block conteudo %}{% endblock %}
    </div>
    <footer>RRister Imports - Rio Claro/SP</footer>
</body>
</html>
